<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203247"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="孔板判读"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="mobile.css"><title>96孔板颜色判读</title>
<style>body{font:15px system-ui;background:#f2f5f8;color:#203247;margin:24px}h1{font-size:25px}.card{background:white;padding:18px;border-radius:12px;margin:14px 0}button,input,select{margin:5px;padding:8px}button{cursor:pointer}canvas{max-width:100%;border:1px solid #bbb}table{border-collapse:collapse;width:100%}td,th{padding:7px;border:1px solid #ddd;text-align:center}.grid button{width:65px;height:48px;font-size:12px}.grid{overflow:auto}small{color:#536477}#notice{white-space:pre-wrap;color:#984d12}</style>
<h1>96孔板 · 颜色辅助判读</h1><p>本机分析 · B12 未接种对照 / C3 最低生长变色 / A1 无药生长对照</p>
<div class="card"><h2>1 · 拍照</h2><p>对齐孔圈，保持光照一致。</p><button id="camera">开启相机</button><button id="stopCamera">关闭相机</button><button id="capture">拍照并判读</button><span id="cameraStatus"></span><div style="position:relative;max-width:900px"><video id="video" autoplay playsinline muted style="width:100%"></video><canvas id="guide" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas></div><button id="saveRig">保存当前机位</button><label><input id="reuse" type="checkbox" checked>沿用定位</label><p id="rigStatus"></p></div>
<div class="card"><h2>2 · 批次校准</h2>批次名称<input id="batchName" placeholder="例如 2026-10-28 第1批"><br>无生长孔<input id="refBase" value="B12" size="4">最低生长孔<input id="refMin" value="C3" size="4">明显生长孔<input id="refEnd" value="A1" size="4"><button id="freeze">保存参照色</button><button id="unfreeze">新批次</button><div id="swatches"></div><p id="batchStatus">未锁定：当前照片的参照孔用于校准</p><button id="profileOut">备份设置</button><input id="profileIn" type="file" accept=".json"><p>同批共用参照色；光照改变后重新校准。</p></div>
<div class="card"><h2>3 · 判读</h2>组别<input id="groupName" placeholder="自动编号"><label><input id="aligned" type="checkbox">已确认方向和孔圈</label><p>换板后对齐，再拍照。</p><input type="file" id="photo" accept="image/*"><button id="locate">定位四角</button><span id="step">上传图片后标记四个角孔中心</span><br>取样半径（像素）<input id="radius" type="number" value="16" min="3" max="100">阈值复核带（指数）<input id="band" type="number" value="8" min="0" max="40"><button id="analyze">重新分析</button><br><canvas id="canvas"></canvas></div>
<div class="card"><label><input type="checkbox" id="controls">已确认三个参照孔有效</label><br><label><input type="checkbox" id="endpoint">已确认MIC终点规则</label><p id="notice"></p><small>灰：复核　蓝：未达阈值　黄：生长。指数不代表菌量。</small><div class="grid" id="heat"></div></div>
<div class="card"><h2>孔位复核</h2><div id="detail">点击热图孔位查看。</div><select id="override"><option value="">保留自动判读</option><option>生长信号</option><option>未达阈值</option><option>待复核</option></select><input id="reason" placeholder="人工修改原因"><button id="save">保存复核</button></div>
<div class="card"><h2>药物布局</h2><p>导入CSV：孔位、药物、浓度、单位、系列。</p><input type="file" id="layout" accept=".csv"><button id="template">下载模板</button><button id="export">导出Excel</button><div id="mic"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('canvas'),ctx=cv.getContext('2d');let img=null,corners=[],mark=false,data=[],selected='',overrides={},layout=[],raw=null,valid=false,threshold=0;
const wells=Array.from({length:96},(_,i)=>'ABCDEFGH'[Math.floor(i/12)]+(i%12+1));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function lab(r,g,b){let a=[r,g,b].map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});let x=(a[0]*.4124564+a[1]*.3575761+a[2]*.1804375)/.95047,y=a[0]*.2126729+a[1]*.7151522+a[2]*.072175,z=(a[0]*.0193339+a[1]*.119192+a[2]*.9503041)/1.08883;[x,y,z]=[x,y,z].map(v=>v>.008856?Math.cbrt(v):7.787*v+16/116);return [116*y-16,500*(x-y),200*(y-z)];}
function center(i){let u=i%12/11,v=Math.floor(i/12)/7;return [0,1].map(k=>(1-v)*((1-u)*corners[0][k]+u*corners[1][k])+v*((1-u)*corners[3][k]+u*corners[2][k]));}
function draw(){if(!img)return;ctx.drawImage(img,0,0,cv.width,cv.height);if(corners.length===4)wells.forEach((w,i)=>{let [x,y]=center(i);ctx.strokeStyle='#1469d9';ctx.beginPath();ctx.arc(x,y,+$('radius').value,0,7);ctx.stroke();ctx.fillStyle='#102944';ctx.fillText(w,x-12,y-20);});else corners.forEach(p=>{ctx.fillStyle='red';ctx.fillRect(p[0]-4,p[1]-4,8,8);});}
$('photo').onchange=e=>{let f=e.target.files[0];if(f)loadPhoto(URL.createObjectURL(f));};
$('locate').onclick=()=>{if(!img)return;corners=[];data=[];overrides={};valid=false;$('heat').innerHTML='';$('mic').innerHTML='';mark=true;$('step').textContent='点击 A1 孔中心';draw();};
cv.onclick=e=>{if(!mark)return;let b=cv.getBoundingClientRect();corners.push([(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height]);$('step').textContent=corners.length<4?'点击 '+['A1','A12','H12','H1'][corners.length]+' 孔中心':'定位完成，请检查孔圈';draw();if(corners.length===4){mark=false;analyze();}};
function analyze(){if(!img||corners.length!==4)return;overrides={};ctx.drawImage(img,0,0,cv.width,cv.height);raw=ctx.getImageData(0,0,cv.width,cv.height).data;let radius=Math.max(3,Math.min(100,+$('radius').value||16));data=wells.map((well,i)=>{let [cx,cy]=center(i),channels=[[],[],[]],bad=0,total=0;for(let y=Math.floor(cy-radius);y<=cy+radius;y++)for(let x=Math.floor(cx-radius);x<=cx+radius;x++){if((x-cx)**2+(y-cy)**2>radius**2)continue;total++;if(x<0||y<0||x>=cv.width||y>=cv.height){bad++;continue;}let p=(y*cv.width+x)*4,v=[raw[p],raw[p+1],raw[p+2]];if(Math.max(...v)>248||Math.min(...v)<12){bad++;continue;}v.forEach((n,k)=>channels[k].push(n));}let rgb=channels.map(a=>{a.sort((a,b)=>a-b);return a.length?a[Math.floor(a.length/2)]:0;});return {well,rgb,lab:lab(...rgb),bad:bad/Math.max(total,1)};});let refs=referenceColors();let base=refs.base.lab,end=refs.end.lab,axis=end.map((v,k)=>v-base[k]),norm=axis.reduce((s,v)=>s+v*v,0);valid=norm>=25&&[refs.base,refs.min,refs.end].every(d=>d.bad<.2);data.forEach(d=>{let diff=d.lab.map((v,k)=>v-base[k]);d.index=100*diff.reduce((s,v,k)=>s+v*axis[k],0)/Math.max(norm,.001);d.off=Math.sqrt(diff.reduce((s,v,k)=>s+(v-d.index/100*axis[k])**2,0));});threshold=100*refs.min.lab.reduce((sum,v,k)=>sum+(v-base[k])*axis[k],0)/Math.max(norm,.001);valid=valid&&threshold>0&&threshold<=100;data.forEach(d=>{d.auto=!valid||d.bad>.2||d.off>15||Math.abs(d.index-threshold)<(+$('band').value||0)?'待复核':d.index>=threshold?'生长信号':'未达阈值';});draw();render();}
function state(d){return overrides[d.well]?.state||d.auto;}
function render(){if(!data.length)return;$('notice').textContent=(valid?'颜色参照有效':'颜色参照无效：检查定位、反光及 B12/C3/A1 颜色分离')+'；C3 指数 '+threshold.toFixed(1)+'。'+(!$('controls').checked?' 尚未确认对照。':'');let h='<table><tr><th></th>'+Array.from({length:12},(_,i)=>'<th>'+(i+1)+'</th>').join('')+'</tr>';for(let r=0;r<8;r++){h+='<tr><th>'+'ABCDEFGH'[r]+'</th>';for(let c=0;c<12;c++){let d=data[r*12+c],s=state(d),color=s==='待复核'?'#dce1e8':s==='生长信号'?'#f4d777':'#bcdaf1';h+='<td><button style="background:'+color+'" data-well="'+d.well+'">'+d.well+'<br>'+d.index.toFixed(0)+(overrides[d.well]?' *':'')+'</button></td>';}h+='</tr>';} $('heat').innerHTML=h+'</table>';$('heat').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.well;let d=data.find(d=>d.well===selected);$('detail').textContent=selected+' | RGB '+d.rgb.join(',')+' | 指数 '+d.index.toFixed(1)+' | 自动：'+d.auto+' | 异常像素 '+(100*d.bad).toFixed(1)+'%';$('override').value=overrides[selected]?.state||'';$('reason').value=overrides[selected]?.reason||'';});$('mic').innerHTML='<table><tr><th>系列</th><th>药物</th><th>候选 MIC</th></tr>'+mics().map(m=>'<tr>'+m.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>';}
function mics(){let groups={};layout.forEach(l=>{let key=JSON.stringify([l.series,l.drug,l.unit]);(groups[key]??=[]).push(l);});return Object.entries(groups).map(([key,ls])=>{let [series,drug,unit]=JSON.parse(key),result='待复核';let rows=ls.map(l=>({c:+l.concentration,d:data.find(d=>d.well===l.well)}));let okay=valid&&$('aligned').checked&&$('controls').checked&&$('endpoint').checked&&rows.every(r=>r.d&&!referenceWells().includes(r.d.well)&&state(r.d)!=='待复核');let levels=[...new Set(rows.map(r=>r.c))].sort((a,b)=>a-b);if(okay&&levels.length>=2){let states=levels.map(c=>{let ss=new Set(rows.filter(r=>r.c===c).map(r=>state(r.d)));return ss.size===1?[...ss][0]:'冲突';});let first=states.indexOf('未达阈值');if(!states.includes('冲突')&&states.every((s,i)=>s===(first<0||i<first?'生长信号':'未达阈值')))result=(first<0?'> '+levels.at(-1):first===0?'≤ '+levels[0]:String(levels[first]))+' '+unit;}return [series,drug,result+'（未作敏感/耐药分类）'];});}
$('analyze').onclick=analyze;$('controls').onchange=render;$('endpoint').onchange=render;$('save').onclick=()=>{if(!selected)return;if($('override').value&&!$('reason').value.trim()){alert('请填写修改原因');return;}if($('override').value)overrides[selected]={state:$('override').value,reason:$('reason').value.trim(),time:new Date().toISOString()};else delete overrides[selected];render();};
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('template').onclick=()=>download('layout.csv','\ufeffwell,drug,concentration,unit,series\r\nA2,药物示例,0.5,mg/L,样本1\r\nA3,药物示例,1,mg/L,样本1\r\n','text/csv');
function csv(text){let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++;}else quote=!quote;}else if(c===','&&!quote){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field='';}else field+=c;}if(quote)throw Error('CSV 引号未闭合');row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows;}
$('layout').onchange=async e=>{try{let rows=csv((await e.target.files[0].text()).replace(/^\uFEFF/,'')),header=rows.shift().map(v=>v.trim());if(['well','drug','concentration','unit','series'].some(k=>!header.includes(k)))throw Error('缺少必需列');let parsed=rows.map(r=>Object.fromEntries(header.map((k,i)=>[k,(r[i]||'').trim()]))),seen=new Set;parsed.forEach(l=>{l.well=l.well.toUpperCase();if(!wells.includes(l.well)||seen.has(l.well)||!l.drug||!l.series||!l.unit||!l.concentration||!Number.isFinite(+l.concentration)||+l.concentration<=0)throw Error('孔位重复、字段缺失或浓度无效：'+l.well);seen.add(l.well);});layout=parsed;render();alert('已导入 '+layout.length+' 个孔');}catch(err){alert(err.message);}};
$('export').onclick=()=>{if(!data.length){alert('请先分析图片');return;}let sheet=(name,rows)=>'<Worksheet ss:Name="'+name+'"><Table>'+rows.map(r=>'<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+esc(v)+'</Data></Cell>').join('')+'</Row>').join('')+'</Table></Worksheet>';let rows=[['孔位','RGB','颜色指数','自动判读','最终判读','复核原因','复核时间','药物','浓度','单位','系列','异常像素比例','沉淀局部对比值'],...data.map(d=>{let l=layout.find(l=>l.well===d.well)||{};return [d.well,d.rgb.join(','),d.index.toFixed(2),d.auto,state(d),overrides[d.well]?.reason,overrides[d.well]?.time,l.drug,l.concentration,l.unit,l.series,d.bad.toFixed(3),d.sediment?.score?.toFixed(4)||''];})];let metadata=[['项目','值'],['导出时间',new Date().toISOString()],['批次',batch?.name||'未锁定'],['保存的颜色',JSON.stringify(batch?.refs||referenceColors())],['组别',$('groupName').value],['对齐确认',$('aligned').checked],['参照孔',referenceWells().join(',')],['参照有效',valid],['人工确认对照',$('controls').checked],['确认MIC终点',$('endpoint').checked],['C3阈值',threshold],['取样半径',$('radius').value],['复核带',$('band').value],['四角坐标',JSON.stringify(corners)],['逐孔中心',JSON.stringify(wells.map((w,i)=>({well:w,center:center(i)})))],['说明','原型结果，未作敏感/耐药分类；颜色指数不是菌量百分比']];download('plate-results.xml','<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheet('逐孔结果',rows)+sheet('候选MIC',[['系列','药物','结果'],...mics()])+sheet('分析记录',metadata)+'</Workbook>','application/xml');};
</script>
<div class="card"><h2>判读记录</h2><button id="historyOut">导出全部</button><button id="historyClear">清空记录</button><div id="history"></div><small>请及时导出备份。</small></div>
